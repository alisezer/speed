[package]
name = "speed"
version = "0.1.0"
edition = "2024"
description = "Internet speed test and live throughput monitor for the terminal"
license = "MIT"
repository = "https://github.com/alisezer/speed"
readme = "README.md"
keywords = ["speedtest", "bandwidth", "latency", "network", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
libc = "0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync", "process"] }
